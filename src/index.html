<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Devil's Door — Endless Ninja Action-Platformer</title>
  <meta name="description" content="An endless dark fantasy ninja action-platformer. Procedural chunks, 3-minute dynamic biome cycles, and infinite shadow combat. Reach the door. Trust nothing." />
  <meta name="theme-color" content="#07090e" />
  <link rel="stylesheet" href="/src/css/game.css" />
</head>
<body>
  <div id="game-container">
    <!-- Main Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
      <h1 class="loading-title">DEVIL'S DOOR</h1>
      <div class="loading-spinner"></div>
      <p class="loading-subtitle">ENTERING THE ENDLESS SHADOWS...</p>
    </div>

    <!-- Minimal, Well-Furnished AAA Action HUD Overlay -->
    <header id="game-hud" class="hud-overlay">
      <!-- Left: Sleek Ninja Avatar & Hearts -->
      <div class="hud-left">
        <div class="hud-avatar-box">🥷</div>
        <div id="health-display" class="hud-health-bar">❤️❤️❤️</div>
      </div>

      <!-- Center: Clean Floating Glass Capsule Metrics -->
      <div class="hud-center">
        <div class="hud-capsule">
          <div class="capsule-metric">
            <span class="capsule-icon">📏</span>
            <span id="distance-display" class="capsule-val">0m</span>
          </div>
          <span class="capsule-divider"></span>
          <div class="capsule-metric">
            <span class="capsule-icon">💎</span>
            <span id="diamonds-display" class="capsule-val gold">0</span>
          </div>
          <span class="capsule-divider"></span>
          <div class="capsule-metric">
            <span class="capsule-icon">🏆</span>
            <span id="highscore-display" class="capsule-val amber">0</span>
          </div>
        </div>
      </div>

      <!-- Right: Compact Control Buttons -->
      <div class="hud-right">
        <button id="btn-audio" class="hud-btn" title="Toggle Audio" aria-label="Toggle Audio">🔊</button>
        <button id="btn-restart" class="hud-btn" title="Restart Run (R)" aria-label="Restart Run">↻</button>
        <button id="btn-menu" class="hud-btn" title="Pause Menu (Esc)" aria-label="Pause Menu">⏸</button>
      </div>
    </header>

    <!-- Mobile Touch Controls Overlay with Realistic Action Buttons -->
    <div id="touch-controls" class="touch-overlay">
      <div class="touch-dpad">
        <!-- Move Left: Engraved Silver Kunai Arrow -->
        <button id="touch-left" class="touch-btn dpad-btn" aria-label="Move Left" title="Move Left">
          <svg viewBox="0 0 64 64" width="44" height="44" class="btn-icon">
            <defs>
              <linearGradient id="silverGradL" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="50%" stop-color="#94a3b8"/>
                <stop offset="100%" stop-color="#475569"/>
              </linearGradient>
              <linearGradient id="arrowGlowL" x1="100%" y1="0%" x2="0%" y2="0%">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#0284c7"/>
              </linearGradient>
            </defs>
            <path d="M48 12 L22 32 L48 52 L40 52 L14 32 L40 12 Z" fill="url(#silverGradL)"/>
            <path d="M54 18 L34 32 L54 46 L48 46 L28 32 L48 18 Z" fill="url(#arrowGlowL)" opacity="0.85"/>
            <polygon points="30,32 44,22 44,42" fill="#f8fafc"/>
          </svg>
        </button>

        <!-- Move Right: Engraved Silver Kunai Arrow -->
        <button id="touch-right" class="touch-btn dpad-btn" aria-label="Move Right" title="Move Right">
          <svg viewBox="0 0 64 64" width="44" height="44" class="btn-icon">
            <defs>
              <linearGradient id="silverGradR" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="50%" stop-color="#94a3b8"/>
                <stop offset="100%" stop-color="#475569"/>
              </linearGradient>
              <linearGradient id="arrowGlowR" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#0284c7"/>
              </linearGradient>
            </defs>
            <path d="M16 12 L42 32 L16 52 L24 52 L50 32 L24 12 Z" fill="url(#silverGradR)"/>
            <path d="M10 18 L30 32 L10 46 L16 46 L36 32 L16 18 Z" fill="url(#arrowGlowR)" opacity="0.85"/>
            <polygon points="34,32 20,22 20,42" fill="#f8fafc"/>
          </svg>
        </button>
      </div>

      <div class="touch-actions">
        <!-- Shuriken Star Button -->
        <button id="touch-shuriken" class="touch-btn action-btn shuriken-btn" aria-label="Throw Shuriken" title="Throw Shuriken">
          <svg viewBox="0 0 64 64" width="42" height="42" class="btn-icon">
            <defs>
              <linearGradient id="shurikenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#e9d5ff"/>
                <stop offset="50%" stop-color="#c084fc"/>
                <stop offset="100%" stop-color="#7e22ce"/>
              </linearGradient>
            </defs>
            <g transform="translate(32, 26)">
              <path d="M0 -22 L5 -7 L20 -20 L7 -5 L22 0 L7 5 L20 20 L5 7 L0 22 L-5 7 L-20 20 L-7 5 L-22 0 L-7 -5 L-20 -20 L-5 -7 Z" fill="url(#shurikenGrad)"/>
              <path d="M0 -22 L5 -7 L0 0 L-5 -7 Z" fill="#ffffff" opacity="0.6"/>
              <path d="M22 0 L7 5 L0 0 L7 -5 Z" fill="#ffffff" opacity="0.6"/>
              <path d="M0 22 L-5 7 L0 0 L5 7 Z" fill="#ffffff" opacity="0.6"/>
              <path d="M-22 0 L-7 -5 L0 0 L-7 5 Z" fill="#ffffff" opacity="0.6"/>
              <circle cx="0" cy="0" r="5" fill="#0f172a"/>
              <circle cx="0" cy="0" r="4.5" stroke="#c084fc" stroke-width="1.8" fill="none"/>
            </g>
            <text x="32" y="58" font-size="8" font-weight="900" text-anchor="middle" fill="#c084fc" letter-spacing="0.5">STAR</text>
          </svg>
        </button>

        <!-- Dash Slash Katana Button -->
        <button id="touch-attack" class="touch-btn action-btn attack-btn" aria-label="Dash Slash" title="Dash Slash">
          <svg viewBox="0 0 64 64" width="46" height="46" class="btn-icon">
            <defs>
              <linearGradient id="slashGlow" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#d97706"/>
                <stop offset="50%" stop-color="#fbbf24"/>
                <stop offset="100%" stop-color="#ffffff"/>
              </linearGradient>
            </defs>
            <path d="M12 48 C 20 28, 36 14, 54 10 C 42 22, 26 38, 12 48 Z" fill="url(#slashGlow)"/>
            <path d="M14 46 C 22 28, 38 16, 52 12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <line x1="8" y1="54" x2="15" y2="45" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
            <circle cx="53" cy="11" r="3" fill="#ffffff"/>
            <text x="32" y="58" font-size="8.5" font-weight="900" text-anchor="middle" fill="#fbbf24" letter-spacing="1">SLASH</text>
          </svg>
        </button>

        <!-- Acrobat Jump Button -->
        <button id="touch-jump" class="touch-btn action-btn jump-btn" aria-label="Jump" title="Jump / Double Jump">
          <svg viewBox="0 0 64 64" width="48" height="48" class="btn-icon">
            <defs>
              <linearGradient id="jumpGlow" x1="0%" y1="100%" x2="0%" y2="0%">
                <stop offset="0%" stop-color="#0284c7"/>
                <stop offset="100%" stop-color="#38bdf8"/>
              </linearGradient>
            </defs>
            <path d="M32 6 L22 16 L27 16 L27 20 L37 20 L37 16 L42 16 Z" fill="url(#jumpGlow)"/>
            <ellipse cx="32" cy="24" rx="11" ry="4" fill="#f8fafc"/>
            <circle cx="32" cy="25" r="4.5" fill="#f8fafc"/>
            <rect x="31" y="24" width="4" height="2" fill="#38bdf8"/>
            <path d="M26 29 L38 29 L41 38 L32 36 L23 38 Z" fill="#f8fafc"/>
            <path d="M23 37 L16 45 L20 48 L27 41 Z" fill="#f8fafc"/>
            <path d="M41 37 L48 45 L44 48 L37 41 Z" fill="#f8fafc"/>
            <path d="M26 28 Q 16 32, 14 44 Q 19 36, 28 30 Z" fill="#ef4444"/>
            <text x="32" y="58" font-size="9" font-weight="900" text-anchor="middle" fill="#38bdf8" letter-spacing="1">JUMP</text>
          </svg>
        </button>
      </div>
    </div>

    <!-- Pause & Game Over Modal Overlay -->
    <div id="modal-overlay" class="modal-backdrop hidden">
      <div class="modal-card">
        <h2 id="modal-title" class="modal-heading">PAUSED</h2>
        <div id="modal-description" class="modal-body">Take breath, shinobi. The endless descent awaits your blade.</div>
        <div class="modal-actions">
          <button id="btn-modal-primary" class="btn-primary">RESUME</button>
          <button id="btn-modal-restart" class="btn-secondary">RESTART RUN</button>
          <button id="btn-modal-home" class="btn-secondary">EXIT TO MENU</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts: Native ECMAScript Modules -->
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
