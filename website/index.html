<body>
  <main class="frame" id="main">

    <a class="mark" href="/" aria-label="Devil&#39;s Door home">
      <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true" focusable="false"><path d="M2 14V2h30M2 24V12h22M2 34V22h14" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="square"/></svg>
    </a>

    <div class="bars" aria-hidden="true"><i></i><i></i></div>
    <p class="vtext">A SHADOW ASSASSIN&#39;S JOURNEY</p>

    <h1 class="headline" id="headline" aria-label="Welcome to Devil&#39;s Door">
      <span class="ln" aria-hidden="true"><span>WELCOME TO</span></span>
      <span class="ln gold" aria-hidden="true"><span>DEVIL&#39;S</span></span>
      <span class="ln gold" aria-hidden="true"><span>DOOR</span></span>
    </h1>

    <img class="hero-img" src="/src/assets/web/landing-khalid.webp" width="900" height="1065" alt="Khalid Abdullah, creator of Devil&#39;s Door, arms crossed in a black hoodie" decoding="async" fetchpriority="high" />

    <p class="tag">REACH THE DOOR.<br />TRUST NOTHING.</p>

    <div class="hub-transit-bar" id="hub-transit-bar">
      <span>Entering <strong>Gaming Hub</strong> in <strong id="transit-timer">3</strong>s</span>
      <a href="/hub.html" class="hub-transit-go">Enter Now &rarr;</a>
      <button type="button" class="hub-transit-cancel" id="transit-cancel" title="Stay on landing poster">&times; Stay</button>
    </div>

    <a class="hub-gateway-btn" href="/hub.html">ENTER GAMING HUB <span class="hub-tag">MARKETPLACE 2.0</span> &rarr;</a>

    <p class="blurb">Four shinobi. Ten realms. An endless dark-fantasy descent where every death teaches something.</p>

    <a class="play" href="/game">PLAY NOW<span class="arr" aria-hidden="true">&rarr;</span></a>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var bar = document.getElementById('hub-transit-bar');
      if (params.get('stay') === '1') {
        if (bar) bar.style.display = 'none';
        return;
      }
      var seconds = 3;
      var timerEl = document.getElementById('transit-timer');
      var cancelBtn = document.getElementById('transit-cancel');
      var timer = setInterval(function () {
        seconds--;
        if (timerEl) timerEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(timer);
          location.href = '/hub.html';
        }
      }, 1000);
      if (cancelBtn) {
        cancelBtn.addEventListener('click', function () {
          clearInterval(timer);
          if (bar) bar.style.display = 'none';
        });
      }
    })();
  </script>
